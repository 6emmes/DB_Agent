version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: wig20_db
    restart: always
    environment:
      # Tutaj Docker weźmie dane z Twojego pliku .env
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    container_name: wig20_ai
    restart: always
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"

  api:                     
    build: .
    container_name: wig20_api
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
    environment:
      DB_HOST: db
      OLLAMA_HOST: ollama
      # Tutaj API weźmie nowe hasło Agenta
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}

  mcp:
    build: .
    container_name: wig20_mcp
    command: uvicorn mcp_server:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Tutaj MCP weźmie nowe hasło Agenta (poprawione!)
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}

  scraper:
    build: .                      
    container_name: wig20_scraper
    command: python -u scraper.py   
    restart: always               
    depends_on:
      db:                         
        condition: service_healthy
    environment:                  
      # Scraper też musi znać nowego użytkownika
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}

volumes:
  mysql_data:
  ollama_data: