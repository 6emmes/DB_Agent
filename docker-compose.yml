version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: wig20_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    container_name: wig20_ai
    restart: always
    command: "> ollama pull qwen3:1.7b && ollama serve"
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"


  api:                     
    build: .
    container_name: wig20_api
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
    environment:
      DB_HOST: db
      OLLAMA_HOST: ollama
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}


  scraper:
    build: .                      
    container_name: wig20_scraper
    command: python -u scraper.py   
    restart: always               
    depends_on:
      db:                         
        condition: service_healthy
    environment:                  
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}






volumes:
  mysql_data:
  ollama_data:
